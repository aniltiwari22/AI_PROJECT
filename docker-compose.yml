version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - OLLAMA_BASE_URL=http://ollama-core:11434
      - OLLAMA_MODEL=llama3
      - OLLAMA_TIMEOUT_MS=180000
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PREDICT=90
      - OLLAMA_NUM_CTX=1024
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_POLL_TIMEOUT_SECONDS=25
    depends_on:
      - ollama-core
    networks:
      - codex-network

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
    networks:
      - codex-network

  ollama-core:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - codex-network

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama-core
    environment:
      - OLLAMA_HOST=http://ollama-core:11434
    entrypoint: ["/bin/sh", "-c"]
    command: "sleep 5 && ollama pull llama3"
    networks:
      - codex-network

networks:
  codex-network:
    driver: bridge

volumes:
  ollama_storage:
